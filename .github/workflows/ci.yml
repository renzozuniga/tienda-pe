name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tienda
          POSTGRES_PASSWORD: tienda
          POSTGRES_DB: tienda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tienda -d tienda"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://tienda:tienda@localhost:5432/tienda?schema=public
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Contract types are up to date
        run: |
          pnpm contracts:generate
          git diff --exit-code packages/contracts/src/schema.ts

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Migrations apply on a clean database
        run: |
          pnpm --filter @tienda/api exec prisma migrate deploy
          pnpm db:seed

      - name: Build
        run: pnpm build

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Informative: a new advisory in a transitive dependency should not block unrelated PRs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

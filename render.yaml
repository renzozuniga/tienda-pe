# Render Blueprint for the walking skeleton (ADR-0005).
# Postgres is NOT created here: it lives in Neon and its URL is entered once as DATABASE_URL.
# Free instances sleep after 15 minutes without traffic; the first request then takes about a minute.
services:
  - type: web
    name: tienda-pe-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter "@tienda/api..." && pnpm --filter @tienda/api build
    # Pre-deploy commands are only available on paid instances, so migrations run right before start.
    startCommand: pnpm --filter @tienda/api exec prisma migrate deploy && pnpm --filter @tienda/api start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths: [apps/api/**, packages/contracts/**, pnpm-lock.yaml, render.yaml]
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: HUSKY
        value: '0'
      - key: API_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: 'true' # Render's proxy sets X-Forwarded-For; rate limits must count the buyer's IP
      - key: DATABASE_URL
        sync: false # Neon connection string (pooled), entered when the Blueprint is created
      - key: WEB_ORIGIN
        sync: false # https://<tienda-pe-web>.onrender.com, comma-separated if more than one

  - type: web
    name: tienda-pe-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter "@tienda/web..." && pnpm --filter @tienda/web build
    staticPublishPath: apps/web/dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths: [apps/web/**, packages/contracts/**, pnpm-lock.yaml, render.yaml]
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: HUSKY
        value: '0'
      - key: VITE_API_URL
        sync: false # https://<tienda-pe-api>.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
